services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: octafin_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    volumes:
      - ./:/var/www
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - octafin_network

  db:
    image: postgres:15-alpine
    container_name: octafin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-octafin_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - octafin_network

networks:
  octafin_network:
    driver: bridge

volumes:
  pgdata:
    driver: local